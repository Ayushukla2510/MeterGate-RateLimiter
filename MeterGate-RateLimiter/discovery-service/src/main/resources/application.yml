server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server khud ko apni hi directory mein register nahi karta
    register-with-eureka: false
    # Eureka server ko kisi aur se registry fetch karne ki zaroorat nahi hai
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info